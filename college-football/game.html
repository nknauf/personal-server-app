<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{AWAY_TEAM}} at {{HOME_TEAM}}
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;

            max-width: 1000px;

            margin: 50px auto;

            padding: 0 20px;

            background: #111827;

            color: #f9fafb;
        }


        a {
            color: #60a5fa;
        }


        .game-header {
            margin:
                25px 0 30px 0;
        }


        .game-header h1 {
            margin-bottom: 8px;
        }


        .game-meta {
            color: #9ca3af;
        }


        .market-card {
            background: #1f2937;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 18px;
        }


        .market-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }


        .market-header h2 {
            margin: 0;

            font-size: 19px;
        }


        .market-header span {
            color: #9ca3af;

            font-size: 13px;
        }


        table {
            width: 100%;

            border-collapse: collapse;
        }


        th {
            color: #9ca3af;

            font-size: 12px;

            text-transform: uppercase;

            text-align: left;
        }


        th,
        td {
            padding: 10px 8px;

            border-bottom:
                1px solid #374151;
        }


        tr:last-child td {
            border-bottom: none;
        }


        .leader td:first-child {
            font-weight: bold;

            color: #86efac;
        }


        .empty-state {
            background: #1f2937;

            color: #9ca3af;

            padding: 20px;

            border-radius: 10px;
        }


        @media (
            max-width: 650px
        ) {

            body {
                padding: 0 12px;
            }


            th,
            td {
                padding: 8px 4px;

                font-size: 12px;
            }


            .market-card {
                overflow-x: auto;
            }

        }

    </style>

</head>

<body>

    <a href="/college-football">
        ← All Games
    </a>


    <header class="game-header">

        <h1>
            {{AWAY_TEAM}} @ {{HOME_TEAM}}
        </h1>

        <div class="game-meta">
            {{GAME_DATE}}
            ·
            {{STATUS}}
        </div>

    </header>


    <main>

        {{CONSENSUS_TABLES}}

    </main>

</body>

</html>
